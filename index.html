<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-title" content="Konular">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Konu Takibi</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1a1d23; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2f6fed; --accent-soft:#e8effd;
  --open:#2f6fed; --waiting:#d97706; --waiting-soft:#fdf1e0; --closed:#16a34a; --closed-soft:#e5f6ec;
  --danger:#dc2626; --danger-soft:#fdeaea;
  --shadow:0 1px 3px rgba(16,24,40,.08);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f3a;
    --accent:#5b8def; --accent-soft:#1e2a44;
    --open:#5b8def; --waiting:#e6a23c; --waiting-soft:#3a2d14; --closed:#3dbb6e; --closed-soft:#15321f;
    --danger:#ef5350; --danger-soft:#3a1717;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:90px;
}
button{font-family:inherit; font-size:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0;}
input,textarea,select{font-family:inherit; font-size:16px; color:var(--text);}
header{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
  display:flex; align-items:center; gap:10px;
}
header h1{font-size:20px; margin:0; flex:1; font-weight:700; letter-spacing:-.2px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.iconbtn{
  width:38px; height:38px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;
}
main{padding:4px 16px 16px; max-width:560px; margin:0 auto;}
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:20px 4px 8px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px; text-align:left; width:100%;
}
.area-card .emoji{font-size:24px;}
.area-card .name{font-weight:600; margin-top:6px;}
.area-card .count{font-size:13px; color:var(--muted); margin-top:2px;}
.count b{color:var(--accent); font-weight:700;}
.count .clean{color:var(--closed);}
.add-card{
  border:1.5px dashed var(--line); border-radius:var(--radius); padding:14px;
  color:var(--muted); font-size:14px; text-align:center; width:100%; background:none; box-shadow:none;
  display:flex; align-items:center; justify-content:center; min-height:60px;
}
.person-row{display:flex; align-items:center; gap:12px; padding:12px 14px;}
.avatar{
  width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;
}
.person-row .info{flex:1; min-width:0;}
.person-row .name{font-weight:600;}
.person-row .count{font-size:13px; color:var(--muted);}
.chev{color:var(--muted); font-size:18px;}
.stack{display:flex; flex-direction:column; gap:8px;}
.topic-row{display:flex; align-items:flex-start; gap:10px; padding:12px 14px;}
.check{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
}
.topic-row.closed .check{background:var(--closed); border-color:var(--closed); color:#fff;}
.topic-row.waiting .check{border-color:var(--waiting);}
.topic-row .body{flex:1; min-width:0; text-align:left;}
.topic-row .title{font-weight:550;}
.topic-row.closed .title{color:var(--muted); text-decoration:line-through;}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.badge{font-size:12px; padding:2px 8px; border-radius:20px; background:var(--bg); color:var(--muted);}
.badge.due-over{background:var(--danger-soft); color:var(--danger); font-weight:600;}
.badge.due-today{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.badge.waiting{background:var(--waiting-soft); color:var(--waiting);}
.badge.group{background:var(--accent-soft); color:var(--accent);}
.empty{color:var(--muted); text-align:center; padding:28px 10px; font-size:15px;}
.empty .big{font-size:30px; margin-bottom:8px;}
.quickadd{display:flex; gap:8px; margin:12px 0 4px;}
.quickadd input{
  flex:1; border:none; border-radius:var(--radius); padding:12px 14px; background:var(--card);
  box-shadow:var(--shadow); outline:none;
}
.quickadd input::placeholder{color:var(--muted);}
.quickadd button{
  background:var(--accent); color:#fff; border-radius:var(--radius); padding:0 18px; font-weight:700; font-size:20px;
}
.linkbtn{color:var(--accent); font-size:14px; font-weight:600; padding:10px 4px;}
.mutedbtn{color:var(--muted); font-size:14px; padding:10px 4px;}
.fab{
  position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom, 0px) + 20px); z-index:25;
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; font-size:28px;
  box-shadow:0 4px 14px rgba(47,111,237,.45); display:flex; align-items:center; justify-content:center;
}
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  background:var(--card); width:100%; max-width:560px;
  border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
  max-height:88vh; overflow-y:auto;
}
.sheet h2{font-size:18px; margin:0 0 14px;}
.sheet label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px;}
.sheet input[type=text],.sheet input[type=email],.sheet input[type=date],.sheet select,.sheet textarea{
  width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--bg); outline:none;
}
.sheet .actions{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; border-radius:12px; padding:13px; font-weight:700; text-align:center;}
.btn.primary{background:var(--accent); color:#fff;}
.btn.ghost{background:var(--bg); color:var(--text);}
.btn.danger{background:var(--danger-soft); color:var(--danger);}
.chips{display:flex; gap:8px;}
.chip{
  flex:1; text-align:center; padding:10px 6px; border-radius:12px; background:var(--bg);
  font-size:14px; font-weight:600; color:var(--muted); border:1.5px solid transparent;
}
.chip.on-open{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
.chip.on-waiting{background:var(--waiting-soft); color:var(--waiting); border-color:var(--waiting);}
.chip.on-closed{background:var(--closed-soft); color:var(--closed); border-color:var(--closed);}
.note{background:var(--card); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);}
.note .when{font-size:12px; color:var(--muted); margin-bottom:2px;}
.note .text{white-space:pre-wrap; font-size:15px;}
.detail-title{font-size:21px; font-weight:700; margin:6px 0 2px; word-break:break-word;}
.detail-sub{color:var(--muted); font-size:14px; margin-bottom:14px;}
.datebar{display:flex; align-items:center; gap:8px; margin-top:8px;}
.datebar input{flex:1; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--card);}
.rowline{display:flex; align-items:center; gap:8px;}
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom, 0px) + 90px);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:14px; z-index:60;
  opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
.toast.show{opacity:.95;}
.hidden{display:none !important;}
/* auth */
.auth-wrap{max-width:400px; margin:0 auto; padding:60px 24px 40px; text-align:center;}
.auth-logo{width:76px; height:76px; border-radius:20px; margin:0 auto 14px; display:block;}
.auth-wrap h1{font-size:24px; margin:0 0 4px;}
.auth-wrap .sub{color:var(--muted); font-size:14px; margin-bottom:26px;}
.auth-wrap input{
  width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 14px;
  background:var(--card); outline:none; margin-bottom:10px; text-align:left;
}
.auth-wrap .btn{width:100%; margin-top:6px;}
.auth-err{color:var(--danger); font-size:14px; min-height:20px; margin:6px 0;}
.member-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--bg); border-radius:20px;
  padding:6px 6px 6px 12px; font-size:14px; margin:0 6px 6px 0;
}
.member-pill button{color:var(--danger); font-weight:700; width:22px; height:22px; border-radius:50%; background:var(--danger-soft); font-size:12px;}
.bellbadge{
  position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
  font-size:11px; min-width:18px; height:18px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; padding:0 4px; font-weight:700;
}
.spin{
  width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent);
  border-radius:50%; margin:120px auto; animation:sp 1s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg);}}
.offline-bar{background:var(--waiting-soft); color:var(--waiting); font-size:13px; text-align:center; padding:6px; border-radius:10px; margin-bottom:10px;}
</style>
</head>
<body>
<header id="header" class="hidden"></header>
<main id="view"><div class="spin"></div></main>
<button class="fab hidden" id="fab" aria-label="Yeni konu">+</button>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var ADMIN_EMAIL = "erdemyuruk@gmail.com";

firebase.initializeApp({
  apiKey: "AIzaSyDZW7a9dwFAOSpWzm4gMukytBzrnTtuKM0",
  authDomain: "konu-takibi.firebaseapp.com",
  projectId: "konu-takibi",
  storageBucket: "konu-takibi.firebasestorage.app",
  messagingSenderId: "48523228961",
  appId: "1:48523228961:web:f0661d44c00ad2f8a03060"
});
var auth = firebase.auth();
var db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}

/* ---------- durum ---------- */
var me = null;            // {uid, email, name, isAdmin}
var groups = {};          // gid -> group
var topics = {};          // gid -> {tid -> topic}
var unsubGroups = null;
var unsubTopics = {};     // gid -> fn
var unsubNotes = null;
var notesCache = [];      // açık konunun notları
var route = {page:"home"};
var groupsReady = false;
var notifs = [];          // bildirim kutum
var unsubInbox = null;

/* ---------- yardımcılar ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "";
  var p = iso.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.toLocaleDateString("tr-TR", {day:"numeric", month:"short"});
}
function fmtDateTime(ts){
  if(!ts) return "";
  var d = new Date(ts);
  return d.toLocaleDateString("tr-TR", {day:"numeric", month:"short"}) + " " +
         d.toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
}
function daysDiff(iso){
  var t = todayStr().split("-"), p = iso.split("-");
  var a = new Date(+t[0], +t[1]-1, +t[2]), b = new Date(+p[0], +p[1]-1, +p[2]);
  return Math.round((b - a) / 86400000);
}
function initials(name){
  var parts = String(name||"?").trim().split(/\s+/);
  var s = parts[0].charAt(0);
  if(parts.length > 1) s += parts[parts.length-1].charAt(0);
  return s.toLocaleUpperCase("tr-TR");
}
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}
function authErrTr(e){
  var c = e && e.code || "";
  if(c.indexOf("invalid-credential")>=0 || c.indexOf("wrong-password")>=0 || c.indexOf("user-not-found")>=0) return "E-posta veya şifre hatalı.";
  if(c.indexOf("email-already-in-use")>=0) return "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.";
  if(c.indexOf("weak-password")>=0) return "Şifre en az 6 karakter olmalı.";
  if(c.indexOf("invalid-email")>=0) return "Geçerli bir e-posta adresi yaz.";
  if(c.indexOf("too-many-requests")>=0) return "Çok fazla deneme yapıldı, biraz bekleyip tekrar dene.";
  if(c.indexOf("network")>=0) return "İnternet bağlantısını kontrol et.";
  return "Bir sorun oluştu: " + (e && e.message || "");
}
function go(r){ route = r; render(); window.scrollTo(0,0); }
function visibleGroups(type){
  return Object.values(groups).filter(function(g){ return g.type===type; })
    .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
}
function openCount(gid){
  var m = topics[gid] || {};
  return Object.values(m).filter(function(t){ return t.status!=="closed"; }).length;
}
function totalCount(gid){
  return Object.keys(topics[gid]||{}).length;
}

/* ---------- firestore dinleyicileri ---------- */
function startListening(){
  stopListening();
  var q = me.isAdmin
    ? db.collection("groups")
    : db.collection("groups").where("memberEmails", "array-contains", me.email);
  unsubGroups = q.onSnapshot(function(snap){
    var seen = {};
    snap.forEach(function(doc){
      var g = doc.data(); g.id = doc.id; seen[doc.id] = true;
      groups[doc.id] = g;
      if(!unsubTopics[doc.id]) listenTopics(doc.id);
    });
    Object.keys(groups).forEach(function(gid){
      if(!seen[gid]){
        delete groups[gid]; delete topics[gid];
        if(unsubTopics[gid]){ unsubTopics[gid](); delete unsubTopics[gid]; }
      }
    });
    if(!groupsReady){
      groupsReady = true;
      if(me.isAdmin && snap.empty) seedDefaults();
    }
    render();
  }, function(err){
    console.error(err);
    toast("Veri okunamadı: yetki ya da bağlantı sorunu");
  });
  listenInbox();
}
function listenInbox(){
  if(unsubInbox) unsubInbox();
  unsubInbox = db.collection("inbox").doc(me.email).collection("items")
    .orderBy("ts","desc").limit(60)
    .onSnapshot(function(snap){
      notifs = [];
      snap.forEach(function(doc){ var n = doc.data(); n.id = doc.id; notifs.push(n); });
      updateBell();
      if(document.getElementById("notifList")) renderNotifSheetInner();
    }, function(err){ console.error("inbox", err); });
}
function unreadCount(){
  return notifs.filter(function(n){ return !n.read; }).length;
}
function updateBell(){
  var b = document.getElementById("bellBadge");
  if(!b) return;
  var c = unreadCount();
  if(c > 0){ b.textContent = c > 99 ? "99+" : c; b.classList.remove("hidden"); }
  else b.classList.add("hidden");
}
function notifyMembers(gid, type, topicTitle, body, tid){
  var g = groups[gid];
  if(!g) return;
  var rec = {};
  (g.memberEmails||[]).forEach(function(em){ rec[em] = true; });
  rec[ADMIN_EMAIL] = true;
  delete rec[me.email];
  var emails = Object.keys(rec);
  if(!emails.length) return;
  var gname = g.type === "person" ? (g.name + " ajandası") : g.name;
  var batch = db.batch();
  emails.forEach(function(em){
    var ref = db.collection("inbox").doc(em).collection("items").doc();
    batch.set(ref, {type:type, title:topicTitle, body:body||"", gid:gid, tid:tid||null,
      groupName:gname, actorName:me.name, ts:Date.now(), read:false});
  });
  batch.commit().catch(function(e){ console.error("notify", e); });
}
function listenTopics(gid){
  unsubTopics[gid] = db.collection("groups").doc(gid).collection("topics")
    .onSnapshot(function(snap){
      var m = {};
      snap.forEach(function(doc){ var t = doc.data(); t.id = doc.id; t.gid = gid; m[doc.id] = t; });
      topics[gid] = m;
      render();
    }, function(err){ console.error("topics", gid, err); });
}
function stopListening(){
  if(unsubGroups){ unsubGroups(); unsubGroups = null; }
  if(unsubInbox){ unsubInbox(); unsubInbox = null; }
  notifs = [];
  Object.values(unsubTopics).forEach(function(fn){ fn(); });
  unsubTopics = {}; groups = {}; topics = {}; groupsReady = false;
  stopNotes();
}
function stopNotes(){ if(unsubNotes){ unsubNotes(); unsubNotes = null; } notesCache = []; }
function listenNotes(gid, tid){
  stopNotes();
  unsubNotes = db.collection("groups").doc(gid).collection("topics").doc(tid)
    .collection("notes").orderBy("ts","desc")
    .onSnapshot(function(snap){
      notesCache = [];
      snap.forEach(function(doc){ var n = doc.data(); n.id = doc.id; notesCache.push(n); });
      if(route.page === "topic") render();
    }, function(err){ console.error("notes", err); });
}
function seedDefaults(){
  var batch = db.batch();
  [["Şirket","🏢"],["Aile","🏠"],["Finans","💰"]].forEach(function(a, i){
    var ref = db.collection("groups").doc();
    batch.set(ref, {name:a[0], emoji:a[1], type:"area", memberEmails:[], createdAt: Date.now()+i});
  });
  batch.commit().catch(function(e){ console.error(e); });
}

/* ---------- giriş ekranı ---------- */
var authMode = "login"; // login | signup
function renderAuth(){
  document.getElementById("header").classList.add("hidden");
  document.getElementById("fab").classList.add("hidden");
  var isL = authMode === "login";
  document.getElementById("view").innerHTML =
    '<div class="auth-wrap">' +
    '<img class="auth-logo" src="icon.png" alt="">' +
    '<h1>Konu Takibi</h1>' +
    '<div class="sub">' + (isL ? "Hesabınla giriş yap" : "Yeni hesap oluştur") + '</div>' +
    (isL ? "" : '<input type="text" id="aName" placeholder="Adın Soyadın" autocomplete="name">') +
    '<input type="email" id="aEmail" placeholder="E-posta" autocomplete="email">' +
    '<input type="password" id="aPass" placeholder="Şifre" autocomplete="' + (isL?"current-password":"new-password") + '">' +
    '<div class="auth-err" id="aErr"></div>' +
    '<button class="btn primary" data-act="auth-go">' + (isL ? "Giriş yap" : "Kayıt ol") + '</button>' +
    '<button class="mutedbtn" data-act="auth-switch" style="margin-top:14px">' +
      (isL ? "Hesabın yok mu? Kayıt ol" : "Zaten hesabın var mı? Giriş yap") + '</button>' +
    (isL ? '<br><button class="mutedbtn" data-act="auth-forgot">Şifremi unuttum</button>' : "") +
    '</div>';
}
function doAuth(){
  var email = (document.getElementById("aEmail").value||"").trim().toLowerCase();
  var pass = document.getElementById("aPass").value||"";
  var errEl = document.getElementById("aErr");
  errEl.textContent = "";
  if(!email || !pass){ errEl.textContent = "E-posta ve şifreyi doldur."; return; }
  if(authMode === "signup"){
    var name = (document.getElementById("aName").value||"").trim();
    if(!name){ errEl.textContent = "Adını yaz."; return; }
    auth.createUserWithEmailAndPassword(email, pass).then(function(cred){
      cred.user.updateProfile({displayName: name});
      return db.collection("users").doc(cred.user.uid).set({name:name, email:email});
    }).catch(function(e){ errEl.textContent = authErrTr(e); });
  } else {
    auth.signInWithEmailAndPassword(email, pass).catch(function(e){ errEl.textContent = authErrTr(e); });
  }
}
function doForgot(){
  var email = (document.getElementById("aEmail").value||"").trim().toLowerCase();
  var errEl = document.getElementById("aErr");
  if(!email){ errEl.textContent = "Önce e-posta adresini yaz, sonra tekrar tıkla."; return; }
  auth.sendPasswordResetEmail(email).then(function(){
    errEl.style.color = "var(--closed)";
    errEl.textContent = "Şifre sıfırlama bağlantısı e-postana gönderildi.";
  }).catch(function(e){ errEl.textContent = authErrTr(e); });
}

/* ---------- ana sayfa ---------- */
function setHeader(html){
  var h = document.getElementById("header");
  h.classList.remove("hidden");
  h.innerHTML = html;
}
function backBtn(target){
  return '<button class="iconbtn" data-act="back" data-target="' + esc(target) + '">‹</button>';
}
function renderHome(){
  setHeader('<h1>📌 Konu Takibi</h1>' +

    '<button class="iconbtn" data-act="settings">⚙️</button>');
  var h = "";
  if(!navigator.onLine) h += '<div class="offline-bar">Çevrimdışısın — değişiklikler bağlanınca eşitlenir</div>';

      var countHtml = n ? "<b>" + n + "</b> açık konu"
                    : (tot ? '<span class="clean">✓ hepsi kapandı</span>' : "henüz konu yok");
      h += '<button class="card area-card" data-act="group" data-id="' + esc(a.id) + '">' +
           '<div class="emoji">' + esc(a.emoji||"📁") + '</div>' +
           '<div class="name">' + esc(a.name) + '</div>' +
           '<div class="count">' + countHtml + '</div></button>';

    h += '</div>';

  var people = visibleGroups("person");
  if(people.length || me.isAdmin){

      var n = openCount(p.id);

           '<div class="chev">›</div></button>';

/* ---------- konu satırı ---------- */
function topicRowHtml(t, showGroup){
  var cls = "topic-row " + t.status;
  var badges = "";
  if(showGroup){
    var g = groups[t.gid];
    if(g) badges += '<span class="badge group">' + esc(g.type==="area" ? ((g.emoji||"📁")+" "+g.name) : ("👤 "+g.name)) + '</span>';
  }
  if(t.status === "waiting") badges += '<span class="badge waiting">⏸ Beklemede</span>';
  if(t.due && t.status !== "closed"){
    var d = daysDiff(t.due);
    if(d < 0) badges += '<span class="badge due-over">⚠ ' + fmtDate(t.due) + ' gecikti</span>';
    else if(d === 0) badges += '<span class="badge due-today">Bugün</span>';
    else badges += '<span class="badge">📅 ' + fmtDate(t.due) + '</span>';
  }
  if(t.noteCount) badges += '<span class="badge">📝 ' + t.noteCount + '</span>';
  return '<div class="card ' + cls + '">' +
    '<button class="check" data-act="toggle" data-gid="' + esc(t.gid) + '" data-id="' + esc(t.id) + '" aria-label="Kapat">✓</button>' +
    '<button class="body" data-act="topic" data-gid="' + esc(t.gid) + '" data-id="' + esc(t.id) + '">' +
    '<div class="title">' + esc(t.title) + '</div>' +
    (badges ? '<div class="badges">' + badges + '</div>' : '') +
    '</button></div>';
}

/* ---------- grup sayfası ---------- */
function renderGroup(){
  var g = groups[route.gid];
  if(!g){ go({page:"home"}); return; }
  var title = g.type === "area" ? ((g.emoji||"📁") + " " + g.name) : ("👤 " + g.name);
  setHeader(backBtn("home") + '<h1>' + esc(title) + '</h1>' +
    (me.isAdmin ? '<button class="iconbtn" data-act="group-menu">⋯</button>' : ""));

  var items = Object.values(topics[route.gid]||{});
  var open = items.filter(function(t){ return t.status!=="closed"; });
  var closed = items.filter(function(t){ return t.status==="closed"; });
  open.sort(function(a,b){
    var av = a.due || "9999", bv = b.due || "9999";
    if(av !== bv) return av < bv ? -1 : 1;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  closed.sort(function(a,b){ return (b.closedAt||0) - (a.closedAt||0); });

  var h = '<div class="quickadd">' +
    '<input id="qa" type="text" placeholder="Yeni konu yaz, Enter\'a bas…" autocomplete="off">' +
    '<button data-act="qa-add">+</button></div>';

  if(!open.length && !closed.length){
    h += '<div class="empty"><div class="big">🌤</div>Henüz konu yok.<br>Yukarıdan ilk konuyu ekle.</div>';
  } else if(!open.length){
    h += '<div class="empty"><div class="big">🎉</div>Açık konu kalmadı!</div>';
  } else {
    h += '<div class="stack" style="margin-top:10px">';
    open.forEach(function(t){ h += topicRowHtml(t, false); });
    h += '</div>';
  }

  if(closed.length){
    h += '<button class="mutedbtn" data-act="toggle-closed">' +
      (route.showClosed ? "▾" : "▸") + ' Kapananlar (' + closed.length + ')</button>';
    if(route.showClosed){
      h += '<div class="stack">';
      closed.forEach(function(t){ h += topicRowHtml(t, false); });
      h += '</div>';
    }
  }

  document.getElementById("view").innerHTML = h;
  document.getElementById("fab").classList.add("hidden");
  var qa = document.getElementById("qa");
  qa.addEventListener("keydown", function(e){ if(e.key === "Enter") quickAdd(); });
}
function quickAdd(){
  var qa = document.getElementById("qa");
  var v = qa.value.trim();
  if(!v) return;
  var gid = route.gid;
  db.collection("groups").doc(gid).collection("topics").add({
    title:v, status:"open", due:null, createdAt:Date.now(), closedAt:null,
    createdBy: me.email, createdByName: me.name, noteCount:0
  }).then(function(ref){
    notifyMembers(gid, "topic", v, "", ref.id);
  }).catch(function(e){ toast("Eklenemedi: " + authErrTr(e)); });
  qa.value = "";
  qa.focus();
}

/* ---------- konu detayı ---------- */
function renderTopic(){
  var m = topics[route.gid] || {};

    '<div class="detail-sub">' + esc(g ? g.name : "") + " · " + esc(t.createdByName||"") +
    " ekledi · " + fmtDateTime(t.createdAt) + '</div>';

  h += '<div class="chips">' +
    chip(t, "open", "Açık") + chip(t, "waiting", "Beklemede") + chip(t, "closed", "Kapandı") + '</div>';

  h += '<div class="section-title">📅 Takip tarihi</div><div class="datebar">' +
    '<input type="date" id="dueInput" value="' + esc(t.due || "") + '">' +
    (t.due ? '<button class="linkbtn" data-act="clear-due">Kaldır</button>' : '') + '</div>';

  h += '<div class="section-title">📝 Notlar</div>' +
    '<div class="rowline"><input type="text" id="noteInput" placeholder="Not / yorum ekle…" autocomplete="off" ' +
    'style="flex:1; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--card); outline:none;">' +
    '<button class="linkbtn" data-act="add-note">Ekle</button></div>';

    h += '<div class="stack" style="margin-top:10px">';
    notesCache.forEach(function(n){
      h += '<div class="note"><div class="when">' + esc(n.authorName||"") + ' · ' + fmtDateTime(n.ts) + '</div>' +
        '<div class="text">' + esc(n.text) + '</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="empty" style="padding:16px">Henüz not yok. Gelişmeleri buraya yazın — ekipçe görünür.</div>';
  }

  document.getElementById("view").innerHTML = h;
  document.getElementById("fab").classList.add("hidden");
  document.getElementById("dueInput").addEventListener("change", function(e){
    topicRef().update({due: e.target.value || null}).catch(function(){ toast("Kaydedilemedi"); });

function chip(t, st, label){
  return '<button class="chip' + (t.status===st ? " on-" + st : "") + '" data-act="status" data-st="' + st + '">' + label + '</button>';
}
function topicRef(){
  return db.collection("groups").doc(route.gid).collection("topics").doc(route.id);
}
function addNote(){
  var inp = document.getElementById("noteInput");
  var v = inp.value.trim();
  if(!v) return;
  inp.value = "";
  topicRef().collection("notes").add({text:v, ts:Date.now(), authorEmail:me.email, authorName:me.name})
    .catch(function(){ toast("Not eklenemedi"); });
  topicRef().update({noteCount: firebase.firestore.FieldValue.increment(1)}).catch(function(){});
  var t = (topics[route.gid]||{})[route.id];
  notifyMembers(route.gid, "note", t ? t.title : "", v, route.id);
}

/* ---------- olaylar ---------- */
document.body.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  var stop = e.target.closest("[data-stop]");
  if(stop && (!el || !stop.contains(el))) return;
  if(!el){
    if(e.target.classList && e.target.classList.contains("overlay")) closeSheet();
    return;
  }
  var act = el.getAttribute("data-act");

  if(act === "auth-go") return doAuth();
  if(act === "auth-switch"){ authMode = authMode==="login" ? "signup" : "login"; return renderAuth(); }
  if(act === "auth-forgot") return doForgot();
  if(act === "logout"){ closeSheet(); auth.signOut(); return; }

  if(act === "settings") return sheetSettings();
  if(act === "close-sheet") return closeSheet();
  if(act === "back"){
    var tg = el.getAttribute("data-target");
    if(tg === "home") return go({page:"home"});
    var p = tg.split(":");
    stopNotes();
    return go({page:"group", gid:p[1]});
  }
  if(act === "group") return go({page:"group", gid:el.getAttribute("data-id")});
  if(act === "topic"){
    var gid = el.getAttribute("data-gid"), tid = el.getAttribute("data-id");
    listenNotes(gid, tid);
    return go({page:"topic", gid:gid, id:tid});
  }
  if(act === "toggle"){
    var gid2 = el.getAttribute("data-gid"), tid2 = el.getAttribute("data-id");
    var t = (topics[gid2]||{})[tid2];
    if(t){
      var closed = t.status === "closed";
      db.collection("groups").doc(gid2).collection("topics").doc(tid2).update({
        status: closed ? "open" : "closed",
        closedAt: closed ? null : Date.now()
      }).then(function(){
        toast(closed ? "Konu tekrar açıldı" : "Konu kapandı ✓");
        notifyMembers(gid2, closed ? "reopen" : "closed", t.title, "", tid2);
      }).catch(function(){ toast("Değiştirilemedi"); });
    }
    return;
  }
  if(act === "notifs") return sheetNotifs();
  if(act === "notif-open"){
    var nid = el.getAttribute("data-id");
    var n = null;
    notifs.forEach(function(x){ if(x.id===nid) n = x; });
    if(!n) return;
    if(!n.read) db.collection("inbox").doc(me.email).collection("items").doc(nid).update({read:true}).catch(function(){});
    closeSheet();
    if(n.gid && groups[n.gid]){
      if(n.tid && (topics[n.gid]||{})[n.tid]){ listenNotes(n.gid, n.tid); go({page:"topic", gid:n.gid, id:n.tid}); }
      else go({page:"group", gid:n.gid});
    }
    return;
  }
  if(act === "notif-readall"){
    var nb = db.batch();
    notifs.forEach(function(n){
      if(!n.read) nb.update(db.collection("inbox").doc(me.email).collection("items").doc(n.id), {read:true});
    });
    nb.commit().catch(function(){});
    return;
  }
  if(act === "toggle-closed"){ route.showClosed = !route.showClosed; return render(); }
  if(act === "qa-add") return quickAdd();
  if(act === "add-area") return sheetName("area");
  if(act === "add-person") return sheetName("person");
  if(act === "group-menu") return sheetGroupMenu();

  if(act === "nt-save"){
    var title = document.getElementById("ntTitle").value.trim();
    if(!title){ toast("Konu başlığı yaz"); return; }
    var gsel = document.getElementById("ntGroup").value;
    var due = document.getElementById("ntDue").value || null;
    db.collection("groups").doc(gsel).collection("topics").add({
      title:title, status:"open", due:due, createdAt:Date.now(), closedAt:null,
      createdBy: me.email, createdByName: me.name, noteCount:0
    }).then(function(ref){
      notifyMembers(gsel, "topic", title, "", ref.id);
    }).catch(function(){ toast("Eklenemedi"); });
    closeSheet();
    go({page:"group", gid:gsel});
    return;
  }
  if(act === "nm-save"){
    var kind = el.getAttribute("data-kind");
    var name = document.getElementById("nmName").value.trim();
    if(!name){ toast("İsim yaz"); return; }
    var data;
    if(kind === "area"){
      var em = (document.getElementById("nmEmoji").value.trim()) || "📁";
      data = {name:name, emoji:em, type:"area", memberEmails:[], createdAt:Date.now()};
    } else {
      var pmail = (document.getElementById("nmEmail").value||"").trim().toLowerCase();
      data = {name:name, type:"person", memberEmails: pmail ? [pmail] : [], createdAt:Date.now()};
    }
    db.collection("groups").add(data).then(function(ref){
      closeSheet(); go({page:"group", gid:ref.id});
    }).catch(function(){ toast("Eklenemedi"); });
    return;
  }
  if(act === "gm-add"){
    var inp = document.getElementById("gmNewEmail");
    var nem = (inp.value||"").trim().toLowerCase();
    if(!nem || nem.indexOf("@") < 0){ toast("Geçerli bir e-posta yaz"); return; }
    db.collection("groups").doc(route.gid).update({
      memberEmails: firebase.firestore.FieldValue.arrayUnion(nem)
    }).then(function(){ toast(nem + " eklendi"); setTimeout(sheetGroupMenu, 300); })
      .catch(function(){ toast("Eklenemedi"); });
    return;
  }
  if(act === "gm-rm"){
    var rem = el.getAttribute("data-email");
    db.collection("groups").doc(route.gid).update({
      memberEmails: firebase.firestore.FieldValue.arrayRemove(rem)
    }).then(function(){ toast("Çıkarıldı"); setTimeout(sheetGroupMenu, 300); })
      .catch(function(){ toast("Çıkarılamadı"); });
    return;
  }
  if(act === "gm-save"){
    var nn = document.getElementById("gmName").value.trim();
    if(!nn){ toast("İsim boş olamaz"); return; }
    db.collection("groups").doc(route.gid).update({name:nn}).catch(function(){ toast("Kaydedilemedi"); });
    closeSheet();
    return;
  }
  if(act === "gm-del"){
    var cnt = totalCount(route.gid);
    var g = groups[route.gid];
    return sheetConfirm(
      (g && g.type==="area" ? "Bu alan" : "Bu kişi") + (cnt ? " ve içindeki " + cnt + " konu silinecek." : " silinecek.") +
      " Bu işlem geri alınamaz.", "gm-del-yes");
  }
  if(act === "gm-del-yes"){
    var gid3 = route.gid;
    var items = Object.values(topics[gid3]||{});
    var batch = db.batch();
    items.forEach(function(t){ batch.delete(db.collection("groups").doc(gid3).collection("topics").doc(t.id)); });
    batch.delete(db.collection("groups").doc(gid3));
    batch.commit().then(function(){ toast("Silindi"); }).catch(function(){ toast("Silinemedi"); });
    closeSheet(); go({page:"home"});
    return;
  }
  if(act === "rename") return sheetRename();
  if(act === "rn-save"){
    var nt = document.getElementById("rnTitle").value.trim();
    if(nt) topicRef().update({title:nt}).catch(function(){ toast("Kaydedilemedi"); });
    closeSheet();
    return;
  }
  if(act === "del-topic"){
    return sheetConfirm("Bu konu ve notları silinecek.", "del-topic-yes");
  }
  if(act === "del-topic-yes"){
    var back = {page:"group", gid:route.gid};
    topicRef().delete().then(function(){ toast("Konu silindi"); }).catch(function(){ toast("Silinemedi"); });
    stopNotes();
    closeSheet(); go(back);
    return;
  }
  if(act === "status"){
    var st = el.getAttribute("data-st");
    var cur = (topics[route.gid]||{})[route.id];
    var wasClosed = cur && cur.status === "closed";
    topicRef().update({status: st, closedAt: st==="closed" ? Date.now() : null})
      .then(function(){
        if(st==="closed") toast("Konu kapandı ✓");
        if(cur){
          if(st === "closed" && !wasClosed) notifyMembers(route.gid, "closed", cur.title, "", route.id);
          else if(st !== "closed" && wasClosed) notifyMembers(route.gid, "reopen", cur.title, "", route.id);
        }
      })
      .catch(function(){ toast("Değiştirilemedi"); });
    return;
  }
  if(act === "clear-due"){
    topicRef().update({due:null}).catch(function(){});
    return;
  }
  if(act === "add-note") return addNote();
});
document.getElementById("fab").addEventListener("click", sheetNewTopic);

/* ---------- render ---------- */
function render(){
  if(!me){ renderAuth(); return; }
  if(!groupsReady){
    setHeader('<h1>📌 Konu Takibi</h1>');
    document.getElementById("view").innerHTML = '<div class="spin"></div>';
    return;
  }
  if(route.page === "home") renderHome();
  else if(route.page === "group") renderGroup();
  else if(route.page === "topic") renderTopic();
}

/* ---------- oturum ---------- */
auth.onAuthStateChanged(function(user){
  if(user){
    var email = (user.email||"").toLowerCase();
    me = {uid:user.uid, email:email, name:user.displayName || email.split("@")[0], isAdmin: email === ADMIN_EMAIL};
    if(!user.displayName){
      db.collection("users").doc(user.uid).get().then(function(doc){
        if(doc.exists && doc.data().name){ me.name = doc.data().name; render(); }
      }).catch(function(){});
    }
    route = {page:"home"};
    startListening();
    render();
  } else {
    me = null;
    stopListening();
    renderAuth();
  }
});
window.addEventListener("online", render);
window.addEventListener("offline", render);
})();
</script>
