<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-title" content="Konular">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Konu Takibi</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1a1d23; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2f6fed; --accent-soft:#e8effd;
  --open:#2f6fed; --waiting:#d97706; --waiting-soft:#fdf1e0; --closed:#16a34a; --closed-soft:#e5f6ec;
  --danger:#dc2626; --danger-soft:#fdeaea;
  --shadow:0 1px 3px rgba(16,24,40,.08);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f3a;
    --accent:#5b8def; --accent-soft:#1e2a44;
    --open:#5b8def; --waiting:#e6a23c; --waiting-soft:#3a2d14; --closed:#3dbb6e; --closed-soft:#15321f;
    --danger:#ef5350; --danger-soft:#3a1717;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:90px;
}
button{font-family:inherit; font-size:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0;}
input,textarea,select{font-family:inherit; font-size:16px; color:var(--text);}
header{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
  display:flex; align-items:center; gap:10px;
}
header h1{font-size:20px; margin:0; flex:1; font-weight:700; letter-spacing:-.2px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.iconbtn{
  width:38px; height:38px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;
}
main{padding:4px 16px 16px; max-width:560px; margin:0 auto;}
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:20px 4px 8px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px; text-align:left; width:100%;
}
.area-card .emoji{font-size:24px;}
.area-card .name{font-weight:600; margin-top:6px;}
.area-card .count{font-size:13px; color:var(--muted); margin-top:2px;}
.count b{color:var(--accent); font-weight:700;}
.count .clean{color:var(--closed);}
.add-card{
  border:1.5px dashed var(--line); border-radius:var(--radius); padding:14px;
  color:var(--muted); font-size:14px; text-align:center; width:100%; background:none; box-shadow:none;
  display:flex; align-items:center; justify-content:center; min-height:60px;
}
.person-row{display:flex; align-items:center; gap:12px; padding:12px 14px;}
.avatar{
  width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;
}
.person-row .info{flex:1; min-width:0;}
.person-row .name{font-weight:600;}
.person-row .count{font-size:13px; color:var(--muted);}
.chev{color:var(--muted); font-size:18px;}
.stack{display:flex; flex-direction:column; gap:8px;}
/* topic rows */
.topic-row{display:flex; align-items:flex-start; gap:10px; padding:12px 14px;}
.check{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
}
.topic-row.closed .check{background:var(--closed); border-color:var(--closed); color:#fff;}
.topic-row.waiting .check{border-color:var(--waiting);}
.topic-row .body{flex:1; min-width:0; text-align:left;}
.topic-row .title{font-weight:550;}
.topic-row.closed .title{color:var(--muted); text-decoration:line-through;}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.badge{font-size:12px; padding:2px 8px; border-radius:20px; background:var(--bg); color:var(--muted);}
.badge.due-over{background:var(--danger-soft); color:var(--danger); font-weight:600;}
.badge.due-today{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.badge.waiting{background:var(--waiting-soft); color:var(--waiting);}
.badge.group{background:var(--accent-soft); color:var(--accent);}
.empty{color:var(--muted); text-align:center; padding:28px 10px; font-size:15px;}
.empty .big{font-size:30px; margin-bottom:8px;}
/* quick add */
.quickadd{display:flex; gap:8px; margin:12px 0 4px;}
.quickadd input{
  flex:1; border:none; border-radius:var(--radius); padding:12px 14px; background:var(--card);
  box-shadow:var(--shadow); outline:none;
}
.quickadd input::placeholder{color:var(--muted);}
.quickadd button{
  background:var(--accent); color:#fff; border-radius:var(--radius); padding:0 18px; font-weight:700; font-size:20px;
}
.linkbtn{color:var(--accent); font-size:14px; font-weight:600; padding:10px 4px;}
.mutedbtn{color:var(--muted); font-size:14px; padding:10px 4px;}
/* fab */
.fab{
  position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom, 0px) + 20px); z-index:25;
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; font-size:28px;
  box-shadow:0 4px 14px rgba(47,111,237,.45); display:flex; align-items:center; justify-content:center;
}
/* sheet / modal */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  background:var(--card); width:100%; max-width:560px;
  border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
  max-height:88vh; overflow-y:auto;
}
.sheet h2{font-size:18px; margin:0 0 14px;}
.sheet label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px;}
.sheet input[type=text],.sheet input[type=date],.sheet select,.sheet textarea{
  width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--bg); outline:none;
}
.sheet textarea{resize:vertical; min-height:70px;}
.sheet .actions{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; border-radius:12px; padding:13px; font-weight:700; text-align:center;}
.btn.primary{background:var(--accent); color:#fff;}
.btn.ghost{background:var(--bg); color:var(--text);}
.btn.danger{background:var(--danger-soft); color:var(--danger);}
/* status chips */
.chips{display:flex; gap:8px;}
.chip{
  flex:1; text-align:center; padding:10px 6px; border-radius:12px; background:var(--bg);
  font-size:14px; font-weight:600; color:var(--muted); border:1.5px solid transparent;
}
.chip.on-open{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
.chip.on-waiting{background:var(--waiting-soft); color:var(--waiting); border-color:var(--waiting);}
.chip.on-closed{background:var(--closed-soft); color:var(--closed); border-color:var(--closed);}
/* notes */
.note{background:var(--card); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);}
.note .when{font-size:12px; color:var(--muted); margin-bottom:2px;}
.note .text{white-space:pre-wrap; font-size:15px;}
.detail-title{font-size:21px; font-weight:700; margin:6px 0 2px; word-break:break-word;}
.detail-sub{color:var(--muted); font-size:14px; margin-bottom:14px;}
.datebar{display:flex; align-items:center; gap:8px; margin-top:8px;}
.datebar input{flex:1; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--card);}
.rowline{display:flex; align-items:center; gap:8px;}
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom, 0px) + 90px);
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:14px; z-index:60;
  opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:.95;}
.hidden{display:none !important;}
</style>
</head>
<body>
<header id="header"></header>
<main id="view"></main>
<button class="fab hidden" id="fab" aria-label="Yeni konu">+</button>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
(function(){
"use strict";
/* ---------- depolama ---------- */
var LS_KEY = "konu-takibi-v1";
var mem = null;
function loadRaw(){
  try{ var s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }
  catch(e){ return mem; }
}
function saveRaw(d){
  mem = d;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){}
}
function defaults(){
  return {
    areas:[
      {id:"a-sirket", name:"Şirket", emoji:"🏢"},
      {id:"a-aile",   name:"Aile",   emoji:"🏠"},
      {id:"a-finans", name:"Finans", emoji:"💰"}
    ],
    people:[],
    topics:[]
  };
}
var db = loadRaw() || defaults();
function save(){ saveRaw(db); }

/* ---------- yardımcılar ---------- */
function uid(){ return "t" + Math.random().toString(36).slice(2,9) + Math.random().toString(36).slice(2,5); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "";
  var p = iso.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.toLocaleDateString("tr-TR", {day:"numeric", month:"short"});
}
function fmtDateTime(ts){
  var d = new Date(ts);
  return d.toLocaleDateString("tr-TR", {day:"numeric", month:"short"}) + " " +
         d.toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
}
function daysDiff(iso){ // due - today (gün)
  var t = todayStr().split("-"), p = iso.split("-");
  var a = new Date(+t[0], +t[1]-1, +t[2]), b = new Date(+p[0], +p[1]-1, +p[2]);
  return Math.round((b - a) / 86400000);
}
function initials(name){
  var parts = name.trim().split(/\s+/);
  var s = parts[0].charAt(0);
  if(parts.length > 1) s += parts[parts.length-1].charAt(0);
  return s.toLocaleUpperCase("tr-TR");
}
function groupOf(t){
  if(t.groupType === "area") return db.areas.find(function(a){return a.id===t.groupId;});
  return db.people.find(function(p){return p.id===t.groupId;});
}
function groupLabel(t){
  var g = groupOf(t);
  if(!g) return "?";
  return t.groupType === "area" ? (g.emoji + " " + g.name) : ("👤 " + g.name);
}
function openTopics(type, id){
  return db.topics.filter(function(t){ return t.groupType===type && t.groupId===id && t.status!=="closed"; });
}
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}

/* ---------- yönlendirme ---------- */
var route = {page:"home"};
function go(r){ route = r; render(); window.scrollTo(0,0); }

/* ---------- başlık + fab ---------- */
function setHeader(html){ document.getElementById("header").innerHTML = html; }
function backBtn(target){
  return '<button class="iconbtn" data-act="back" data-target="' + esc(target) + '">‹</button>';
}

/* ---------- ana sayfa ---------- */
function renderHome(){
  setHeader('<h1>📌 Konu Takibi</h1><button class="iconbtn" data-act="settings">⚙️</button>');
  var h = "";

  // takip zamanı gelenler
  var due = db.topics.filter(function(t){ return t.status!=="closed" && t.due && daysDiff(t.due) <= 7; });
  due.sort(function(a,b){ return a.due < b.due ? -1 : 1; });
  if(due.length){
    h += '<div class="section-title">⏰ Takip zamanı</div><div class="stack">';
    due.forEach(function(t){ h += topicRowHtml(t, true); });
    h += '</div>';
  }

  // alanlar
  h += '<div class="section-title">Alanlar</div><div class="grid">';
  db.areas.forEach(function(a){
    var n = openTopics("area", a.id).length;
    var total = db.topics.filter(function(t){return t.groupType==="area" && t.groupId===a.id;}).length;
    var countHtml = n ? "<b>" + n + "</b> açık konu"
                  : (total ? '<span class="clean">✓ hepsi kapandı</span>' : "henüz konu yok");
    h += '<button class="card area-card" data-act="group" data-type="area" data-id="' + esc(a.id) + '">' +
         '<div class="emoji">' + esc(a.emoji) + '</div>' +
         '<div class="name">' + esc(a.name) + '</div>' +
         '<div class="count">' + countHtml + '</div>' +
         '</button>';
  });
  h += '<button class="add-card" data-act="add-area">+ Alan ekle</button></div>';

  // kişiler
  h += '<div class="section-title">Kişiler</div><div class="stack">';
  if(!db.people.length){
    h += '<div class="empty" style="padding:14px">Takip ettiğin kişileri ekle — her kişiyle konuşacağın konular ayrı listede dursun.</div>';
  }
  db.people.forEach(function(p){
    var n = openTopics("person", p.id).length;
    h += '<button class="card person-row" data-act="group" data-type="person" data-id="' + esc(p.id) + '">' +
         '<div class="avatar">' + esc(initials(p.name)) + '</div>' +
         '<div class="info"><div class="name">' + esc(p.name) + '</div>' +
         '<div class="count">' + (n ? n + " açık konu" : "açık konu yok") + '</div></div>' +
         '<div class="chev">›</div></button>';
  });
  h += '<button class="add-card" data-act="add-person">+ Kişi ekle</button></div>';

  document.getElementById("view").innerHTML = h;
  document.getElementById("fab").classList.remove("hidden");
}

/* ---------- konu satırı ---------- */
function topicRowHtml(t, showGroup){
  var cls = "topic-row " + t.status;
  var badges = "";
  if(showGroup) badges += '<span class="badge group">' + esc(groupLabel(t)) + '</span>';
  if(t.status === "waiting") badges += '<span class="badge waiting">⏸ Beklemede</span>';
  if(t.due && t.status !== "closed"){
    var d = daysDiff(t.due);
    if(d < 0) badges += '<span class="badge due-over">⚠ ' + fmtDate(t.due) + ' gecikti</span>';
    else if(d === 0) badges += '<span class="badge due-today">Bugün</span>';
    else badges += '<span class="badge">📅 ' + fmtDate(t.due) + '</span>';
  }
  if(t.notes.length) badges += '<span class="badge">📝 ' + t.notes.length + '</span>';
  return '<div class="card ' + cls + '">' +
    '<button class="check" data-act="toggle" data-id="' + esc(t.id) + '" aria-label="Kapat">✓</button>' +
    '<button class="body" data-act="topic" data-id="' + esc(t.id) + '">' +
    '<div class="title">' + esc(t.title) + '</div>' +
    (badges ? '<div class="badges">' + badges + '</div>' : '') +
    '</button></div>';
}

/* ---------- grup sayfası ---------- */
function renderGroup(){
  var type = route.type, id = route.id;
  var g = type === "area" ? db.areas.find(function(a){return a.id===id;}) : db.people.find(function(p){return p.id===id;});
  if(!g){ go({page:"home"}); return; }
  var title = type === "area" ? (g.emoji + " " + g.name) : ("👤 " + g.name);
  setHeader(backBtn("home") + '<h1>' + esc(title) + '</h1>' +
    '<button class="iconbtn" data-act="group-menu">⋯</button>');

  var items = db.topics.filter(function(t){ return t.groupType===type && t.groupId===id; });
  var open = items.filter(function(t){ return t.status!=="closed"; });
  var closed = items.filter(function(t){ return t.status==="closed"; });
  open.sort(function(a,b){
    var av = a.due || "9999", bv = b.due || "9999";
    if(av !== bv) return av < bv ? -1 : 1;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  closed.sort(function(a,b){ return (b.closedAt||0) - (a.closedAt||0); });

  var h = '<div class="quickadd">' +
    '<input id="qa" type="text" placeholder="Yeni konu yaz, Enter\'a bas…" autocomplete="off">' +
    '<button data-act="qa-add">+</button></div>';

  if(!open.length && !closed.length){
    h += '<div class="empty"><div class="big">🌤</div>Henüz konu yok.<br>Yukarıdan ilk konuyu ekle.</div>';
  } else if(!open.length){
    h += '<div class="empty"><div class="big">🎉</div>Açık konu kalmadı!</div>';
  } else {
    h += '<div class="stack" style="margin-top:10px">';
    open.forEach(function(t){ h += topicRowHtml(t, false); });
    h += '</div>';
  }

  if(closed.length){
    h += '<button class="mutedbtn" data-act="toggle-closed">' +
      (route.showClosed ? "▾" : "▸") + ' Kapananlar (' + closed.length + ')</button>';
    if(route.showClosed){
      h += '<div class="stack">';
      closed.forEach(function(t){ h += topicRowHtml(t, false); });
      h += '</div>';
    }
  }

  document.getElementById("view").innerHTML = h;
  document.getElementById("fab").classList.add("hidden");
  var qa = document.getElementById("qa");
  qa.addEventListener("keydown", function(e){ if(e.key === "Enter") quickAdd(); });
}
function quickAdd(){
  var qa = document.getElementById("qa");
  var v = qa.value.trim();
  if(!v) return;
  db.topics.push({id:uid(), title:v, groupType:route.type, groupId:route.id,
    status:"open", due:null, notes:[], createdAt:Date.now(), closedAt:null});
  save(); render();
  var q2 = document.getElementById("qa");
  if(q2){ q2.focus(); }
  toast("Konu eklendi");
}

/* ---------- konu detayı ---------- */
function renderTopic(){
  var t = db.topics.find(function(x){ return x.id===route.id; });
  if(!t){ go({page:"home"}); return; }
  var backTarget = "group:" + t.groupType + ":" + t.groupId;
  setHeader(backBtn(backTarget) + '<h1></h1>' +
    '<button class="iconbtn" data-act="rename" data-id="' + esc(t.id) + '">✏️</button>' +
    '<button class="iconbtn" data-act="del-topic" data-id="' + esc(t.id) + '">🗑</button>');

  var h = '<div class="detail-title">' + esc(t.title) + '</div>' +
    '<div class="detail-sub">' + esc(groupLabel(t)) + ' · ' + fmtDateTime(t.createdAt) + '</div>';

  h += '<div class="chips">' +
    chip(t, "open", "Açık") + chip(t, "waiting", "Beklemede") + chip(t, "closed", "Kapandı") + '</div>';

  h += '<div class="section-title">📅 Takip tarihi</div><div class="datebar">' +
    '<input type="date" id="dueInput" value="' + esc(t.due || "") + '">' +
    (t.due ? '<button class="linkbtn" data-act="clear-due">Kaldır</button>' : '') + '</div>';

  h += '<div class="section-title">📝 Notlar</div>' +
    '<div class="rowline"><input type="text" id="noteInput" placeholder="Not ekle…" autocomplete="off" ' +
    'style="flex:1; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--card); outline:none;">' +
    '<button class="linkbtn" data-act="add-note">Ekle</button></div>';

  var notes = t.notes.slice().reverse();
  if(notes.length){
    h += '<div class="stack" style="margin-top:10px">';
    notes.forEach(function(n){
      h += '<div class="note"><div class="when">' + fmtDateTime(n.ts) + '</div>' +
        '<div class="text">' + esc(n.text) + '</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="empty" style="padding:16px">Henüz not yok. Gelişmeleri buraya yaz — hiçbir şey aklında kalmasın.</div>';
  }

  document.getElementById("view").innerHTML = h;
  document.getElementById("fab").classList.add("hidden");
  document.getElementById("dueInput").addEventListener("change", function(e){
    t.due = e.target.value || null; save(); render();
  });
  document.getElementById("noteInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") addNote();
  });
}
function chip(t, st, label){
  return '<button class="chip' + (t.status===st ? " on-" + st : "") + '" data-act="status" data-id="' +
    esc(t.id) + '" data-st="' + st + '">' + label + '</button>';
}
function addNote(){
  var t = db.topics.find(function(x){ return x.id===route.id; });
  var inp = document.getElementById("noteInput");
  var v = inp.value.trim();
  if(!t || !v) return;
  t.notes.push({ts:Date.now(), text:v});
  save(); render();
}

/* ---------- modallar ---------- */
function openSheet(html){
  document.getElementById("modal").innerHTML =
    '<div class="overlay" data-act="close-sheet"><div class="sheet" data-stop="1">' + html + '</div></div>';
}
function closeSheet(){ document.getElementById("modal").innerHTML = ""; }

function sheetNewTopic(){
  var opts = "";
  db.areas.forEach(function(a){ opts += '<option value="area:' + esc(a.id) + '">' + esc(a.emoji + " " + a.name) + '</option>'; });
  db.people.forEach(function(p){ opts += '<option value="person:' + esc(p.id) + '">👤 ' + esc(p.name) + '</option>'; });
  openSheet('<h2>Yeni konu</h2>' +
    '<label>Konu</label><input type="text" id="ntTitle" placeholder="Ne takip edilecek?" autocomplete="off">' +
    '<label>Nerede</label><select id="ntGroup">' + opts + '</select>' +
    '<label>Takip tarihi (isteğe bağlı)</label><input type="date" id="ntDue">' +
    '<div class="actions"><button class="btn ghost" data-act="close-sheet">Vazgeç</button>' +
    '<button class="btn primary" data-act="nt-save">Ekle</button></div>');
  setTimeout(function(){ var el = document.getElementById("ntTitle"); if(el) el.focus(); }, 60);
}
function sheetName(kind){ // kind: "area" | "person"
  var isArea = kind === "area";
  openSheet('<h2>' + (isArea ? "Yeni alan" : "Yeni kişi") + '</h2>' +
    (isArea ? '<label>Simge</label><input type="text" id="nmEmoji" placeholder="📁" maxlength="4">' : '') +
    '<label>' + (isArea ? "Alan adı" : "İsim") + '</label>' +
    '<input type="text" id="nmName" placeholder="' + (isArea ? "örn. Yatırımlar" : "örn. Ahmet") + '" autocomplete="off">' +
    '<div class="actions"><button class="btn ghost" data-act="close-sheet">Vazgeç</button>' +
    '<button class="btn primary" data-act="nm-save" data-kind="' + kind + '">Ekle</button></div>');
  setTimeout(function(){ var el = document.getElementById("nmName"); if(el) el.focus(); }, 60);
}
function sheetGroupMenu(){
  var isArea = route.type === "area";
  openSheet('<h2>' + (isArea ? "Alan" : "Kişi") + ' ayarları</h2>' +
    '<label>Adı</label><input type="text" id="gmName" autocomplete="off">' +
    '<div class="actions"><button class="btn danger" data-act="gm-del">Sil</button>' +
    '<button class="btn primary" data-act="gm-save">Kaydet</button></div>');
  var g = isArea ? db.areas.find(function(a){return a.id===route.id;}) : db.people.find(function(p){return p.id===route.id;});
  document.getElementById("gmName").value = g ? g.name : "";
}
function sheetRename(id){
  var t = db.topics.find(function(x){ return x.id===id; });
  if(!t) return;
  openSheet('<h2>Konuyu düzenle</h2>' +
    '<label>Başlık</label><input type="text" id="rnTitle" autocomplete="off">' +
    '<div class="actions"><button class="btn ghost" data-act="close-sheet">Vazgeç</button>' +
    '<button class="btn primary" data-act="rn-save" data-id="' + esc(id) + '">Kaydet</button></div>');
  document.getElementById("rnTitle").value = t.title;
}
function sheetConfirm(msg, act, data){
  openSheet('<h2>Emin misin?</h2><p style="color:var(--muted); margin:0">' + esc(msg) + '</p>' +
    '<div class="actions"><button class="btn ghost" data-act="close-sheet">Vazgeç</button>' +
    '<button class="btn danger" data-act="' + esc(act) + '" data-id="' + esc(data||"") + '">Evet, sil</button></div>');
}
function sheetSettings(){
  var open = db.topics.filter(function(t){return t.status!=="closed";}).length;
  var closedN = db.topics.length - open;
  openSheet('<h2>Ayarlar</h2>' +
    '<p style="color:var(--muted); font-size:14px; margin:0 0 4px">' +
    db.areas.length + ' alan · ' + db.people.length + ' kişi · ' + open + ' açık, ' + closedN + ' kapanmış konu</p>' +
    '<p style="color:var(--muted); font-size:13px">Veriler bu telefondaki tarayıcıda saklanır. Ara sıra yedek almanı öneririm.</p>' +
    '<div class="actions" style="margin-top:10px">' +
    '<button class="btn ghost" data-act="import">İçe aktar</button>' +
    '<button class="btn primary" data-act="export">Yedek indir</button></div>');
}

/* ---------- dışa / içe aktarma ---------- */
function doExport(){
  var blob = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "konu-takibi-yedek-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Yedek indirildi");
}
document.getElementById("importFile").addEventListener("change", function(e){
  var f = e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.areas) || !Array.isArray(d.topics)) throw 0;
      d.people = Array.isArray(d.people) ? d.people : [];
      db = d; save(); closeSheet(); go({page:"home"});
      toast("Yedek geri yüklendi");
    }catch(err){ toast("Dosya okunamadı"); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ---------- olaylar ---------- */
document.body.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(e.target.closest("[data-stop]") && !el) return;
  if(!el){
    if(e.target.classList && e.target.classList.contains("overlay")) closeSheet();
    return;
  }
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");

  if(act === "settings") return sheetSettings();
  if(act === "close-sheet") return closeSheet();
  if(act === "back"){
    var tg = el.getAttribute("data-target");
    if(tg === "home") return go({page:"home"});
    var p = tg.split(":");
    return go({page:"group", type:p[1], id:p[2]});
  }
  if(act === "group") return go({page:"group", type:el.getAttribute("data-type"), id:id || el.getAttribute("data-id")});
  if(act === "topic") return go({page:"topic", id:id});
  if(act === "toggle"){
    var t = db.topics.find(function(x){return x.id===id;});
    if(t){
      if(t.status === "closed"){ t.status = "open"; t.closedAt = null; toast("Konu tekrar açıldı"); }
      else { t.status = "closed"; t.closedAt = Date.now(); toast("Konu kapandı ✓"); }
      save(); render();
    }
    return;
  }
  if(act === "toggle-closed"){ route.showClosed = !route.showClosed; return render(); }
  if(act === "qa-add") return quickAdd();
  if(act === "fab" ) return sheetNewTopic();
  if(act === "add-area") return sheetName("area");
  if(act === "add-person") return sheetName("person");
  if(act === "group-menu") return sheetGroupMenu();

  if(act === "nt-save"){
    var title = document.getElementById("ntTitle").value.trim();
    if(!title){ toast("Konu başlığı yaz"); return; }
    var gv = document.getElementById("ntGroup").value.split(":");
    var due = document.getElementById("ntDue").value || null;
    db.topics.push({id:uid(), title:title, groupType:gv[0], groupId:gv[1],
      status:"open", due:due, notes:[], createdAt:Date.now(), closedAt:null});
    save(); closeSheet();
    go({page:"group", type:gv[0], id:gv[1]});
    toast("Konu eklendi");
    return;
  }
  if(act === "nm-save"){
    var kind = el.getAttribute("data-kind");
    var name = document.getElementById("nmName").value.trim();
    if(!name){ toast("İsim yaz"); return; }
    if(kind === "area"){
      var em = (document.getElementById("nmEmoji").value.trim()) || "📁";
      var na = {id:uid(), name:name, emoji:em};
      db.areas.push(na); save(); closeSheet(); go({page:"group", type:"area", id:na.id});
    } else {
      var np = {id:uid(), name:name};
      db.people.push(np); save(); closeSheet(); go({page:"group", type:"person", id:np.id});
    }
    return;
  }
  if(act === "gm-save"){
    var nn = document.getElementById("gmName").value.trim();
    if(!nn){ toast("İsim boş olamaz"); return; }
    var g = route.type === "area" ? db.areas.find(function(a){return a.id===route.id;})
                                  : db.people.find(function(p){return p.id===route.id;});
    if(g){ g.name = nn; save(); }
    closeSheet(); render();
    return;
  }
  if(act === "gm-del"){
    var cnt = db.topics.filter(function(t){return t.groupType===route.type && t.groupId===route.id;}).length;
    return sheetConfirm(
      cnt ? "Bu " + (route.type==="area"?"alan":"kişi") + " ve içindeki " + cnt + " konu tamamen silinecek."
          : "Bu " + (route.type==="area"?"alan":"kişi") + " silinecek.",
      "gm-del-yes");
  }
  if(act === "gm-del-yes"){
    db.topics = db.topics.filter(function(t){ return !(t.groupType===route.type && t.groupId===route.id); });
    if(route.type === "area") db.areas = db.areas.filter(function(a){return a.id!==route.id;});
    else db.people = db.people.filter(function(p){return p.id!==route.id;});
    save(); closeSheet(); go({page:"home"});
    toast("Silindi");
    return;
  }
  if(act === "rename") return sheetRename(id);
  if(act === "rn-save"){
    var t2 = db.topics.find(function(x){return x.id===id;});
    var nt = document.getElementById("rnTitle").value.trim();
    if(t2 && nt){ t2.title = nt; save(); }
    closeSheet(); render();
    return;
  }
  if(act === "del-topic"){
    return sheetConfirm("Bu konu ve notları silinecek.", "del-topic-yes", id);
  }
  if(act === "del-topic-yes"){
    var t3 = db.topics.find(function(x){return x.id===id;});
    var back = t3 ? {page:"group", type:t3.groupType, id:t3.groupId} : {page:"home"};
    db.topics = db.topics.filter(function(x){return x.id!==id;});
    save(); closeSheet(); go(back);
    toast("Konu silindi");
    return;
  }
  if(act === "status"){
    var t4 = db.topics.find(function(x){return x.id===id;});
    if(t4){
      var st = el.getAttribute("data-st");
      t4.status = st;
      t4.closedAt = st === "closed" ? Date.now() : null;
      save(); render();
      if(st === "closed") toast("Konu kapandı ✓");
    }
    return;
  }
  if(act === "clear-due"){
    var t5 = db.topics.find(function(x){return x.id===route.id;});
    if(t5){ t5.due = null; save(); render(); }
    return;
  }
  if(act === "add-note") return addNote();
  if(act === "export") return doExport();
  if(act === "import"){ document.getElementById("importFile").click(); return; }
});
document.getElementById("fab").addEventListener("click", sheetNewTopic);

/* ---------- render ---------- */
function render(){
  if(route.page === "home") renderHome();
  else if(route.page === "group") renderGroup();
  else if(route.page === "topic") renderTopic();
}
render();
})();
</script>
</body>
</html>
